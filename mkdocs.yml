site_name: The AI Course
site_description: A multi-level, hands-on AI course from foundations to frontier topics.
site_url: https://sankarsh98.github.io/ai-course/
repo_url: https://github.com/sankarsh98/ai-course
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.sections, navigation.top, content.code.copy, search.suggest, toc.follow]
markdown_extensions:
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex: {generic: true}
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - Learning paths: learning-paths.md
  - Capstone projects: capstones.md
  - "Level 0: Foundations":
      - level-0-foundations/index.md
      - level-0-foundations/01-python-numpy-for-ml.md
      - level-0-foundations/02-linear-algebra.md
      - level-0-foundations/03-calculus-and-autodiff.md
      - level-0-foundations/04-probability-and-statistics.md
      - level-0-foundations/05-optimization.md
  - "Level 1: Classical ML":
      - level-1-classical-ml/index.md
      - level-1-classical-ml/01-ml-workflow-and-evaluation.md
      - level-1-classical-ml/02-linear-and-logistic-models.md
      - level-1-classical-ml/03-trees-and-ensembles.md
      - level-1-classical-ml/04-unsupervised-learning.md
      - level-1-classical-ml/05-data-and-features.md
  - "Level 2: Deep learning":
      - level-2-deep-learning/index.md
      - level-2-deep-learning/01-neural-networks-and-backprop.md
      - level-2-deep-learning/02-training-deep-networks.md
      - level-2-deep-learning/03-convolutional-networks.md
      - level-2-deep-learning/04-sequence-models.md
      - level-2-deep-learning/05-transformers.md
      - level-2-deep-learning/06-representation-learning-and-embeddings.md
  - "Level 3: Modern AI":
      - level-3-modern-ai/index.md
      - level-3-modern-ai/01-language-model-pretraining.md
      - level-3-modern-ai/02-post-training-and-alignment-methods.md
      - level-3-modern-ai/03-generative-models-and-diffusion.md
      - level-3-modern-ai/04-vision-and-multimodal-models.md
      - level-3-modern-ai/05-reinforcement-learning-foundations.md
      - level-3-modern-ai/06-retrieval-and-rag.md
      - level-3-modern-ai/07-agents-and-tool-use.md
      - level-3-modern-ai/08-recommenders-and-ranking.md
      - level-3-modern-ai/09-time-series-and-graphs.md
      - level-3-modern-ai/10-ai-for-science-and-healthcare.md
  - "Level 4: Engineering and society":
      - level-4-engineering-and-society/index.md
      - level-4-engineering-and-society/01-mlops-and-deployment.md
      - level-4-engineering-and-society/02-efficient-training-and-inference.md
      - level-4-engineering-and-society/03-evaluation-and-benchmarks.md
      - level-4-engineering-and-society/04-interpretability.md
      - level-4-engineering-and-society/05-safety-alignment-and-governance.md
      - level-4-engineering-and-society/06-research-skills-and-careers.md
  - Reference:
      - Bibliography: bibliography.md
      - Verification notes: verification.md
